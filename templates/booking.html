{% extends 'base.html' %}{% block title %}Book a service{% endblock %}{% block content %}<section class="container page-wrap narrow"><span class="eyebrow">LET'S GET IT SORTED</span><h1 class="fw-bold mt-2">Tell us what's going on.</h1><p class="text-muted mb-4">We'll recommend a service and show you an approximate price.</p><div class="panel"><form method="post" id="booking-form"><label class="form-label">What do you need help with?</label><textarea class="form-control" name="description" id="description" rows="4" minlength="8" placeholder="For example: the kitchen tap is leaking under the sink…" required></textarea><div class="recommendation" id="recommendation">Describe the issue to get a service suggestion.</div><label class="form-label mt-3">Service category</label><select class="form-select" name="category" id="category"><option value="">Use recommendation</option>{% for item in categories %}<option>{{ item }}</option>{% endfor %}</select><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Preferred date</label><input class="form-control" type="date" name="service_date" min="{{ today }}" required></div><div class="col-md-6"><label class="form-label">Time window</label><select class="form-select" name="time_slot"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div></div><label class="estimate-box mt-4"><span>Approximate starting estimate<small>Final cost may vary after inspection.</small></span><strong id="estimate">₹—</strong></label><label class="urgent-toggle mt-3"><input type="checkbox" name="urgent"><span><b>It's urgent</b><small>Flag this request for priority review.</small></span></label><button class="btn btn-primary btn-lg w-100 mt-4">Find my home pro →</button></form></div></section>{% endblock %}{% block scripts %}<script>window.homeEaseServices={{ categories|tojson }};</script>{% endblock %}
