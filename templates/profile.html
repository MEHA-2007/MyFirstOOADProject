{% extends 'base.html' %}{% block title %}Your profile{% endblock %}{% block content %}
<style>
    body {
        background: radial-gradient(
            ellipse at center,
            #f1fbf2 0%,
            #d5f0cf 55%,
            #2f8b4a 100%
        ) !important;
    }

    .page-wrap {
        max-width: 1100px !important;
        width: 95%;
        margin-left: auto;
        margin-right: auto;
    }
</style>
<section class="container page-wrap narrow"><span class="eyebrow">YOUR DETAILS</span><h1 class="fw-bold mt-2">Profile.</h1><div class="panel mt-4"><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ user.name }}" required><label class="form-label">Email</label><input class="form-control mb-3" value="{{ user.email }}" disabled><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ user.phone or '' }}"><label class="form-label">Service address</label><textarea class="form-control mb-3" name="address">{{ user.address or '' }}</textarea><button class="btn btn-primary">Save profile</button></form></div></section>{% endblock %}
