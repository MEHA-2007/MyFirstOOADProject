{% extends 'base.html' %}{% block title %}Your profile{% endblock %}{% block content %}<section class="container page-wrap narrow"><span class="eyebrow">YOUR DETAILS</span><h1 class="fw-bold mt-2">Profile.</h1><div class="panel mt-4"><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ user.name }}" required><label class="form-label">Email</label><input class="form-control mb-3" value="{{ user.email }}" disabled><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ user.phone or '' }}"><label class="form-label">Service address</label><textarea class="form-control mb-3" name="address">{{ user.address or '' }}</textarea><button class="btn btn-primary">Save profile</button></form></div></section>{% endblock %}
