<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HomeEase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f0f4fb;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px #1d355715;
        }

        h1 {
            color: #2454c5;
            text-align: center;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5deea;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2454c5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            background: #fff4d6;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #2454c5;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔐 Forgot Password?</h1>

        <p>
            Enter your registered email and phone number to verify your account.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="email">Registered Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <label for="phone">Registered Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your registered phone number"
                autocomplete="tel"
                required
            >

            <button type="submit">Verify Account</button>
        </form>

        <a class="back" href="{{ url_for('role_login') }}">
            ← Back to Login
        </a>
    </div>
</body>
</html>
