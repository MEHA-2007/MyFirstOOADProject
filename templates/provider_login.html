{% extends 'base.html' %}

{% block title %}Provider Login | HomeEase{% endblock %}

{% block content %}

<style>
    .provider-login-page {
        min-height: 88vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 18px;
        background: linear-gradient(135deg, #eaf4ff, #d9ebff);
        border-radius: 16px;
    }

    .provider-login-container {
        width: 100%;
        max-width: 490px;
    }

    .provider-brand {
        text-align: center;
        margin-bottom: 30px;
    }

    .provider-brand h1 {
        font-size: 42px;
        font-weight: 800;
        color: #15345b;
        letter-spacing: -1px;
        margin-bottom: 5px;
    }

    .provider-brand h1 span {
        color: #3984d6;
    }

    .provider-brand p {
        font-size: 17px;
        color: #536c8c;
        margin: 0;
    }

    .provider-login-card {
        background: rgba(255, 255, 255, 0.97);
        padding: 38px;
        border: 1px solid #d2e5fc;
        border-radius: 20px;
        box-shadow: 0 16px 45px rgba(39, 100, 170, 0.13);
    }

    .provider-icon {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #dcecff;
        color: #1e5b99;
        border-radius: 50%;
        font-size: 30px;
    }

    .provider-login-card h2 {
        text-align: center;
        font-size: 29px;
        font-weight: 750;
        color: #17365d;
        margin-bottom: 10px;
    }

    .provider-description {
        text-align: center;
        color: #657b96;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    .provider-login-card .form-label {
        color: #183b63;
        font-weight: 650;
        margin-bottom: 8px;
    }

    .provider-login-card .form-control {
        height: 50px;
        border: 1px solid #cbdff7;
        border-radius: 10px;
        padding: 12px 14px;
        background: #fbfdff;
        font-size: 15px;
    }

    .provider-login-card .form-control:focus {
        border-color: #3984d6;
        box-shadow: 0 0 0 3px rgba(57, 132, 214, 0.13);
    }

    .provider-submit-btn {
        width: 100%;
        min-height: 52px;
        margin-top: 8px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #3984d6, #2465ad);
        color: white;
        font-size: 16px;
        font-weight: 700;
        transition: all 0.2s ease;
    }

    .provider-submit-btn:hover {
        background: linear-gradient(135deg, #2873c2, #174f91);
        box-shadow: 0 6px 16px rgba(36, 101, 173, 0.22);
        transform: translateY(-1px);
    }

    .provider-divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 24px 0;
        color: #7488a3;
        font-size: 14px;
    }

    .provider-divider::before,
    .provider-divider::after {
        content: "";
        height: 1px;
        background: #d7e6f8;
        flex: 1;
    }

    .provider-back-link {
        display: block;
        text-align: center;
        color: #2873c2;
        font-weight: 600;
        text-decoration: none;
    }

    .provider-back-link:hover {
        color: #174f91;
        text-decoration: underline;
    }

    @media (max-width: 576px) {
        .provider-brand h1 {
            font-size: 34px;
        }

        .provider-login-card {
            padding: 28px 22px;
        }

        .provider-login-card h2 {
            font-size: 25px;
        }
    }
</style>

<div class="provider-login-page">
    <div class="provider-login-container">

        <div class="provider-brand">
            <h1>Home<span>Ease</span></h1>
            <p>Your Home Services Partner</p>
        </div>

        <div class="provider-login-card">

            <div class="provider-icon">🛠️</div>

            <h2>Provider Login</h2>

            <p class="provider-description">
                Access your provider dashboard and manage your bookings.
            </p>

            <form method="POST">

                <div class="mb-3">
                    <label for="provider-email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="provider-email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="provider-password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="provider-password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="provider-submit-btn">
                    Login as Provider
                </button>

            </form>

            <div class="provider-divider">OR</div>

            <a
                href="{{ url_for('role_login') }}"
                class="provider-back-link"
            >
                Back to role selection
            </a>

        </div>
    </div>
</div>

{% endblock %}
